name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }} - Quality Gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean install dependencies
        id: install
        run: npm ci

      - name: Code Quality & Linting (ESLint)
        id: lint
        run: npm run lint

      - name: Typecheck & Production Build (Vite + TypeScript)
        id: build
        run: npm run build

      - name: Verify Backend JavaScript Syntax
        id: syntax
        run: |
          node --check server.js
          node --check worker-entry.js
          find server -type f -name "*.js" -exec node --check {} +

      - name: Generate Reviewer Summary
        if: always()
        run: |
          echo "### 🔍 CI Quality Gate Report (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Clean Dependency Install** | ${{ steps.install.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | Pure \`npm ci\` with strict peer resolution |" >> $GITHUB_STEP_SUMMARY
          echo "| **ESLint Quality Checks** | ${{ steps.lint.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | React hooks & TypeScript standards |" >> $GITHUB_STEP_SUMMARY
          echo "| **TypeScript & Vite Bundle** | ${{ steps.build.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | Strict \`tsc -b\` & client asset bundling |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Syntax Validation** | ${{ steps.syntax.outcome == 'success' && '✅ Passed' || '❌ Failed' }} | Verified syntax across all server & worker scripts |" >> $GITHUB_STEP_SUMMARY
